<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OB Talks – reception screen</title>
<style>
  /* OB brand: ink and white only, Futura Md BT, no bold, no caps, no letter-spacing */
  :root {
    --ink: #333333;
    --white: #FFFFFF;
    --font: "Futura Md BT", Futura, "Century Gothic", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--white);
    color: var(--ink);
    font-family: var(--font);
    font-weight: normal;
    overflow: hidden;
    cursor: none;
  }

  .screen {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 23vw;
    gap: 4vw;
    padding: 5vh 4vw;
    align-items: center;
  }

  /* Video keeps its natural shape – never stretched or cropped */
  .video-wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    background: var(--ink);
  }

  /* Panel image scales evenly with the screen – never stretched */
  .context img { display: block; width: 100%; height: auto; }
  .series { font-size: 1.5vw; }
  .context h1 {
    font-size: 3.2vw;
    line-height: 1.1;
    font-weight: normal;
    margin: 2vh 0 3.5vh;
  }
  .context p { font-size: 1.4vw; line-height: 1.5; margin-bottom: 2.4vh; }
  .context p:last-child { margin-bottom: 0; }

  /* QR stays a fixed size – never stretched */
  .qr { display: block; width: 9vw; height: 9vw; margin-top: 2vh; }

  /* Slides fill the screen at their own 16:9 shape – never stretched */
  .slides { position: fixed; inset: 0; background: var(--white); display: none; }
  .slides.on { display: block; }
  .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
           opacity: 0; transition: opacity 0.8s ease; }
  .slide.on { opacity: 1; }
  .screen { transition: opacity 0.8s ease; }
  .screen.off { opacity: 0; }

  /* Fallback cover – shown whole, never stretched */
  .fallback { display: none; position: fixed; inset: 0; background: var(--white); }
  .fallback img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <main class="screen">
    <div class="video-wrap">
      <!-- The video sits next to this file as ob-talks.mp4. It plays muted because TVs and
           browsers block autoplay with sound (the subtitles are burned in). -->
      <video id="film" poster="poster.jpg" src="ob-talks.mp4" autoplay muted playsinline></video>
    </div>

    <!-- EDIT THE WORDING HERE -->
    <aside class="context">
      <!-- Text and QR code are one image in Futura Md BT, so the font file never goes online -->
      <img src="panel.png" alt="OB Talks. Olly and Nick take on the question bowl. Olly sits down with Nick from VM to answer your questions about peak, Black Friday and the year ahead. Scan to watch it with sound on 360Learning.">
    </aside>
  </main>

  <!-- SLIDES: add, remove or reorder here. Each shows for SLIDE_SECONDS after the video. -->
  <div class="slides">
    <img class="slide" src="slide-values-in-action.png" alt="Who made your quarter? Nominate someone who’s shown Work Hard, Play Hard or Be Kind for Values in Action. Nominations close 16th December. Scan to nominate.">
    <img class="slide" src="slide-retail-trust.png" alt="Retail Trust is here for you. Free, confidential support, day or night: 0808 801 0808. Register using Oliver Bonas as your employer. Scan to register.">
  </div>
  <div class="fallback" id="fallback"><img alt="OB Talks: Olly and Nick take on the question bowl" src="cover.jpg"></div>

<script>
  const SLIDE_SECONDS = 20;            // how long each slide stays up
  const film = document.getElementById('film');
  const screen = document.querySelector('.screen');
  const slideBox = document.querySelector('.slides');
  const slides = [...document.querySelectorAll('.slide')];
  const fallback = document.getElementById('fallback');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function showSlides() {
    slideBox.classList.add('on');
    for (const s of slides) {
      s.classList.add('on');
      await wait(SLIDE_SECONDS * 1000);
      s.classList.remove('on');
      await wait(800);
    }
    slideBox.classList.remove('on');
  }

  // Video plays once, then the slides, then round again
  film.addEventListener('ended', async () => {
    screen.classList.add('off');
    await showSlides();
    film.currentTime = 0;
    screen.classList.remove('off');
    film.play().catch(() => {});
  });

  // If the video won’t load: show the cover, then the slides, on repeat
  film.addEventListener('error', async () => {
    while (true) {
      fallback.style.display = 'block';
      await wait(SLIDE_SECONDS * 1000);
      fallback.style.display = 'none';
      await showSlides();
    }
  }, { once: true });

  // If the TV ever pauses it mid-play, start it again
  film.addEventListener('pause', () => { if (!film.ended) film.play().catch(() => {}); });
</script>
</body>
</html>
